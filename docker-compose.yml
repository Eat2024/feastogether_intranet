# 本地開發用 compose。啟動：docker compose up
#
# 前後端各自一個 container：
#   - 瀏覽器開 http://localhost:3000（client）
#   - client 打相對 /api → Next rewrites proxy 到 http://server:3000（compose 內部網路）
#   - 後端若要單獨打：http://localhost:3001
services:
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        API_PROXY_TARGET: http://server:3000
    image: feastogether-intranet-client:local
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: feastogether-intranet-server:local
    # environment 優先於 env_file：容器內只覆蓋連線 host 為 compose service 名
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_MYSQL_HOST: mysql
      REDIS_HOST: redis
    env_file:
      - ./server/.env
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    command: ["--default-time-zone=+00:00"]
    environment:
      # 本地拋棄式 DB（非機密）；root 空密碼，對齊 server/.env.example
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: feastogether_intranet
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
