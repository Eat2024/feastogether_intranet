<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電子簽署邀請（手機）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#288BC8}a:hover{color:#2276AA}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F5F6; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #212121; overflow: hidden">
  <header style="height: 56px; flex: none; display: flex; align-items: center; padding: 0 16px; background: #202229">
    <span style="font-size: 20px; font-weight: 700; line-height: 1.25; color: #FFFFFF">電子簽署</span>
  </header>

  <main style="flex: 1; display: flex; justify-content: center; padding: 160px 16px 16px">
    <section style="width: 100%; box-sizing: border-box; padding: 24px; background: #FFFFFF; border-radius: 16px; box-shadow: 0 0 10px rgba(0,0,0,0.125); display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; align-self: flex-start">
      <svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><path fill="#1976D2" d="m18.85 10.39 1.06-1.06c.78-.78.78-2.05 0-2.83L18.5 5.09c-.78-.78-2.05-.78-2.83 0l-1.06 1.06zm-5.66-2.83-9.05 9.05c-.09.09-.14.22-.14.35v3.54c0 .28.22.5.5.5h3.54c.13 0 .26-.05.35-.15l9.05-9.05zM19 17.5c0 2.19-2.54 3.5-5 3.5-.55 0-1-.45-1-1s.45-1 1-1c1.54 0 3-.73 3-1.5 0-.47-.48-.87-1.23-1.2l1.48-1.48c1.07.63 1.75 1.47 1.75 2.68M4.58 13.35C3.61 12.79 3 12.06 3 11c0-1.8 1.89-2.63 3.56-3.36C7.59 7.18 9 6.56 9 6c0-.41-.78-1-2-1-1.26 0-1.8.61-1.83.64-.35.41-.98.46-1.4.12-.41-.34-.49-.95-.15-1.38C3.73 4.24 4.76 3 7 3s4 1.32 4 3c0 1.87-1.93 2.72-3.64 3.47C6.42 9.88 5 10.5 5 11c0 .31.43.6 1.07.86z"></path></svg>
      <h1 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.25; color: #424242">電子簽署邀請</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.7; color: #757575">您收到一份需要簽署的文件，開啟後即可閱讀內容並完成簽名。</p>
      <div style="width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 16px">
        <button type="button" style="width: 100%; height: 42px; padding: 0 22px; border: 0; border-radius: 4px; background: #1976D2; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 3px 1px -2px rgba(0,0,0,0.2), 0 2px 2px 0 rgba(0,0,0,0.14), 0 1px 5px 0 rgba(0,0,0,0.12); cursor: pointer">開啟電子簽署文件</button>
      </div>
      <p style="margin: 8px 0 0; font-size: 12px; line-height: 1.7; color: #757575">此連結僅供受邀的簽署人本人使用，請勿轉寄。<br>請於邀請信所列的簽署期限前完成，逾期即失效。</p>
    </section>
  </main>
</div>
</body>
</html>
