<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>外部簽署・同意聲明（桌面）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#288BC8}a:hover{color:#2276AA}
</style>
</head>
<body>
<div style="min-height: 800px; display: flex; flex-direction: column; background: #F3F5F6; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #212121">
  <header style="height: 64px; flex: none; display: flex; align-items: center; padding: 0 24px; background: #202229">
    <span style="font-size: 20px; font-weight: 700; line-height: 1.25; color: #FFFFFF">電子簽署</span>
  </header>

  <main style="flex: 1; min-width: 0; padding: 24px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1.25; color: #424242">供應商保密協議（NDA）</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.7; color: #757575">簽署人 王大明（daming.wang@example.com）・簽署期限 2026/10/31</p>
    </div>

    <ol aria-label="簽署步驟" style="margin: 0; padding: 0; list-style: none; display: flex; align-items: center">
      <li style="display: flex; align-items: center; gap: 8px; padding: 0 8px 0 0">
        <span style="width: 24px; height: 24px; border-radius: 9999px; background: #1976D2; color: #FFFFFF; font-size: 12px; display: flex; align-items: center; justify-content: center">1</span>
        <span style="font-size: 14px; font-weight: 500; color: #212121; white-space: nowrap">同意授權條款</span>
      </li>
      <li aria-hidden="true" style="flex: 1; border-top: 1px solid #BDBDBD; margin: 0 8px"></li>
      <li style="display: flex; align-items: center; gap: 8px; padding: 0 8px">
        <span style="width: 24px; height: 24px; border-radius: 9999px; background: rgba(0,0,0,0.38); color: #FFFFFF; font-size: 12px; display: flex; align-items: center; justify-content: center">2</span>
        <span style="font-size: 14px; color: rgba(0,0,0,0.6); white-space: nowrap">閱讀文件</span>
      </li>
      <li aria-hidden="true" style="flex: 1; border-top: 1px solid #BDBDBD; margin: 0 8px"></li>
      <li style="display: flex; align-items: center; gap: 8px; padding: 0 8px">
        <span style="width: 24px; height: 24px; border-radius: 9999px; background: rgba(0,0,0,0.38); color: #FFFFFF; font-size: 12px; display: flex; align-items: center; justify-content: center">3</span>
        <span style="font-size: 14px; color: rgba(0,0,0,0.6); white-space: nowrap">完成簽名</span>
      </li>
      <li aria-hidden="true" style="flex: 1; border-top: 1px solid #BDBDBD; margin: 0 8px"></li>
      <li style="display: flex; align-items: center; gap: 8px; padding: 0 0 0 8px">
        <span style="width: 24px; height: 24px; border-radius: 9999px; background: rgba(0,0,0,0.38); color: #FFFFFF; font-size: 12px; display: flex; align-items: center; justify-content: center">4</span>
        <span style="font-size: 14px; color: rgba(0,0,0,0.6); white-space: nowrap">確認送出</span>
      </li>
    </ol>

    <section style="padding: 24px; background: #FFFFFF; border: 1px solid #E7E9EA; border-radius: 8px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.25; color: #424242">電子簽署同意聲明</h2>
        <p style="margin: 0; font-size: 16px; line-height: 1.7; color: #757575">簽署「供應商保密協議（NDA）」前，請詳閱以下聲明，同意後才能開始閱讀與簽署文件。</p>
      </div>
      <div style="padding: 16px 24px; background: #F5F5F5; border: 1px solid #E7E9EA; border-radius: 4px">
        <p style="margin: 0; font-size: 14px; line-height: 1.7; color: #212121">本人已閱讀並了解本文件內容，並同意以電子形式進行簽署。本人確認畫面中的手寫簽名代表本人對本文件內容的簽署意思表示。</p>
      </div>
      <span style="font-size: 12px; line-height: 1.7; color: #757575">聲明版本：esign-consent-v1</span>
      <label style="display: inline-flex; align-items: center; align-self: flex-start; margin-left: -11px; cursor: pointer">
        <span style="position: relative; display: inline-flex; padding: 9px">
          <input type="checkbox" style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer">
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="rgba(0,0,0,0.6)" d="M19 5v14H5V5h14m0-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"></path></svg>
        </span>
        <span style="font-size: 14px; line-height: 1.7; color: #212121">我已詳閱並同意上述聲明</span>
      </label>
      <div style="display: flex; justify-content: flex-end; gap: 8px">
        <button type="button" disabled style="height: 42px; padding: 0 22px; border: 0; border-radius: 4px; background: rgba(0,0,0,0.12); color: rgba(0,0,0,0.26); font: inherit; font-size: 14px; font-weight: 500">同意並繼續</button>
      </div>
    </section>
  </main>
</div>
</body>
</html>
