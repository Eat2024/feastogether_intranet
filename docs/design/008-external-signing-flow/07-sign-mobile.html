<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>外部簽署・閱讀與簽名（手機）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#288BC8}a:hover{color:#2276AA}
</style>
</head>
<body>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F5F6; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #212121; overflow: hidden">
  <header style="height: 56px; flex: none; display: flex; align-items: center; padding: 0 16px; background: #202229">
    <span style="font-size: 20px; font-weight: 700; line-height: 1.25; color: #FFFFFF">電子簽署</span>
  </header>

  <main style="padding: 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1.25; color: #424242">供應商保密協議（NDA）</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.7; color: #757575">簽署人 王大明・簽署期限 2026/10/31</p>
    </div>

    <ol aria-label="簽署步驟" style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
      <li style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <svg width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="已完成"><path fill="#1976D2" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2M9.29 16.29 5.7 12.7a.996.996 0 0 1 0-1.41c.39-.39 1.02-.39 1.41 0L10 14.17l6.88-6.88c.39-.39 1.02-.39 1.41 0s.39 1.02 0 1.41l-7.59 7.59c-.38.39-1.02.39-1.41 0"></path></svg>
        <span style="font-size: 12px; font-weight: 500; color: #212121; white-space: nowrap">同意授權條款</span>
      </li>
      <li style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <span aria-hidden="true" style="position: absolute; top: 12px; left: calc(-50% + 20px); right: calc(50% + 20px); border-top: 1px solid #BDBDBD"></span>
        <svg width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="已完成"><path fill="#1976D2" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2M9.29 16.29 5.7 12.7a.996.996 0 0 1 0-1.41c.39-.39 1.02-.39 1.41 0L10 14.17l6.88-6.88c.39-.39 1.02-.39 1.41 0s.39 1.02 0 1.41l-7.59 7.59c-.38.39-1.02.39-1.41 0"></path></svg>
        <span style="font-size: 12px; font-weight: 500; color: #212121; white-space: nowrap">閱讀文件</span>
      </li>
      <li style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <span aria-hidden="true" style="position: absolute; top: 12px; left: calc(-50% + 20px); right: calc(50% + 20px); border-top: 1px solid #BDBDBD"></span>
        <svg width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="已完成"><path fill="#1976D2" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2M9.29 16.29 5.7 12.7a.996.996 0 0 1 0-1.41c.39-.39 1.02-.39 1.41 0L10 14.17l6.88-6.88c.39-.39 1.02-.39 1.41 0s.39 1.02 0 1.41l-7.59 7.59c-.38.39-1.02.39-1.41 0"></path></svg>
        <span style="font-size: 12px; font-weight: 500; color: #212121; white-space: nowrap">完成簽名</span>
      </li>
      <li style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <span aria-hidden="true" style="position: absolute; top: 12px; left: calc(-50% + 20px); right: calc(50% + 20px); border-top: 1px solid #BDBDBD"></span>
        <span style="width: 24px; height: 24px; border-radius: 9999px; background: #1976D2; color: #FFFFFF; font-size: 12px; display: flex; align-items: center; justify-content: center">4</span>
        <span style="font-size: 12px; font-weight: 500; color: #212121; white-space: nowrap">確認送出</span>
      </li>
    </ol>

    <section aria-label="文件內容" style="padding: 16px; background: #FFFFFF; border: 1px solid #E7E9EA; border-radius: 8px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; line-height: 1.7; color: #757575">需簽名的頁面：第 2 頁</span>
      <div style="position: relative; width: 100%; aspect-ratio: 210 / 297; box-sizing: border-box; padding: 32px 24px; background: #FFFFFF; border: 1px solid #E0E0E0; box-shadow: 0 3px 1px -2px rgba(0,0,0,0.2), 0 2px 2px 0 rgba(0,0,0,0.14), 0 1px 5px 0 rgba(0,0,0,0.12); overflow: hidden">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="height: 8px; width: 40%; background: #EEEEEE; border-radius: 4px; margin-bottom: 8px"></div>
          <div style="height: 5px; width: 100%; background: #F5F5F5; border-radius: 4px"></div>
          <div style="height: 5px; width: 94%; background: #F5F5F5; border-radius: 4px"></div>
          <div style="height: 5px; width: 98%; background: #F5F5F5; border-radius: 4px"></div>
          <div style="height: 5px; width: 70%; background: #F5F5F5; border-radius: 4px; margin-bottom: 8px"></div>
          <div style="height: 5px; width: 100%; background: #F5F5F5; border-radius: 4px"></div>
          <div style="height: 5px; width: 90%; background: #F5F5F5; border-radius: 4px"></div>
          <div style="height: 5px; width: 60%; background: #F5F5F5; border-radius: 4px"></div>
        </div>
        <button type="button" aria-label="第 2 頁簽名欄位，已簽名，點擊可重新簽名" style="position: absolute; left: 10%; top: 72%; width: 23.5%; height: 7%; box-sizing: border-box; border: 1.5px solid transparent; border-radius: 4px; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="64" height="22" viewBox="0 0 120 40" fill="none" stroke="#212121" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 30C16 6 26 4 28 24s10 12 20-8 18-6 18 10 14 14 26-6 12-8 20 4"></path></svg>
        </button>
        <div style="position: absolute; left: 56%; top: 72%; width: 23.5%; height: 7%; box-sizing: border-box; border-bottom: 1px solid #BDBDBD; display: flex; align-items: center; justify-content: center">
          <span style="font-size: 12px; color: #212121; white-space: nowrap">2026/10/20</span>
        </div>
      </div>
    </section>
  </main>

  <section aria-label="簽名進度" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 16px 16px; background: #FFFFFF; border-top: 1px solid #E7E9EA; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 8px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 500; line-height: 1.25; color: #212121">簽名進度</h2>
      <span style="font-size: 14px; color: #757575">1/1</span>
      <span style="margin-left: auto; display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 9999px; background: #E4F3E5; color: #419544; font-size: 12px; font-weight: 500">已簽名</span>
    </div>
    <label style="display: inline-flex; align-items: center; align-self: flex-start; margin-left: -11px; cursor: pointer">
      <span style="position: relative; display: inline-flex; padding: 9px">
        <input type="checkbox" checked style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="#1976D2" d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.11 0 2-.9 2-2V5c0-1.1-.89-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"></path></svg>
      </span>
      <span style="font-size: 14px; line-height: 1.7; color: #212121">我已閱讀並同意上述文件內容</span>
    </label>
    <button type="button" style="width: 100%; height: 42px; border: 0; border-radius: 4px; background: #1976D2; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 3px 1px -2px rgba(0,0,0,0.2), 0 2px 2px 0 rgba(0,0,0,0.14), 0 1px 5px 0 rgba(0,0,0,0.12); cursor: pointer">確認簽署</button>
  </section>
</div>
</body>
</html>
