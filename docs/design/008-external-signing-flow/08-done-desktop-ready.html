<!doctype html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>
<div style="min-height: 800px; display: flex; flex-direction: column; background: #F3F5F6; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #212121">
  <header style="height: 64px; flex: none; display: flex; align-items: center; padding: 0 24px; background: #202229">

  <main style="flex: 1; min-width: 0; padding: 24px; display: flex; flex-direction: column; gap: 24px">

    </div>

    <ol aria-label="簽署步驟" style="margin: 0; padding: 0; list-style: none; display: flex; align-items: center">
      <li style="display: flex; align-items: center; gap: 8px; padding: 0 8px 0 0">
        <svg width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="已完成"><path fill="#1976D2" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2M9.29 16.29 5.7 12.7a.996.996 0 0 1 0-1.41c.39-.39 1.02-.39 1.41 0L10 14.17l6.88-6.88c.39-.39 1.02-.39 1.41 0s.39 1.02 0 1.41l-7.59 7.59c-.38.39-1.02.39-1.41 0"></path></svg>

      </li>
      <li aria-hidden="true" style="flex: 1; border-top: 1px solid #BDBDBD; margin: 0 8px"></li>
      <li style="display: flex; align-items: center; gap: 8px; padding: 0 8px">
        <svg width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="已完成"><path fill="#1976D2" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2M9.29 16.29 5.7 12.7a.996.996 0 0 1 0-1.41c.39-.39 1.02-.39 1.41 0L10 14.17l6.88-6.88c.39-.39 1.02-.39 1.41 0s.39 1.02 0 1.41l-7.59 7.59c-.38.39-1.02.39-1.41 0"></path></svg>
        <span style="font-size: 14px; font-weight: 500; color: #212121; white-space: nowrap">閱讀文件</span>
      </li>
      <li aria-hidden="true" style="flex: 1; border-top: 1px solid #BDBDBD; margin: 0 8px"></li>
      <li style="display: flex; align-items: center; gap: 8px; padding: 0 8px">
        <svg width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="已完成"><path fill="#1976D2" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2M9.29 16.29 5.7 12.7a.996.996 0 0 1 0-1.41c.39-.39 1.02-.39 1.41 0L10 14.17l6.88-6.88c.39-.39 1.02-.39 1.41 0s.39 1.02 0 1.41l-7.59 7.59c-.38.39-1.02.39-1.41 0"></path></svg>
        <span style="font-size: 14px; font-weight: 500; color: #212121; white-space: nowrap">完成簽名</span>
      </li>
      <li aria-hidden="true" style="flex: 1; border-top: 1px solid #BDBDBD; margin: 0 8px"></li>
      <li style="display: flex; align-items: center; gap: 8px; padding: 0 0 0 8px">
        <svg width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="已完成"><path fill="#1976D2" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2M9.29 16.29 5.7 12.7a.996.996 0 0 1 0-1.41c.39-.39 1.02-.39 1.41 0L10 14.17l6.88-6.88c.39-.39 1.02-.39 1.41 0s.39 1.02 0 1.41l-7.59 7.59c-.38.39-1.02.39-1.41 0"></path></svg>
        <span style="font-size: 14px; font-weight: 500; color: #212121; white-space: nowrap">確認送出</span>
      </li>
    </ol>

    <section style="padding: 24px; background: #FFFFFF; border: 1px solid #E7E9EA; border-radius: 8px; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; align-items: center; gap: 16px">
        <svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true" style="flex: none"><path fill="#4CAF50" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2M9.29 16.29 5.7 12.7a.996.996 0 0 1 0-1.41c.39-.39 1.02-.39 1.41 0L10 14.17l6.88-6.88c.39-.39 1.02-.39 1.41 0s.39 1.02 0 1.41l-7.59 7.59c-.38.39-1.02.39-1.41 0"></path></svg>

          <h2 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.25; color: #424242">簽署完成</h2>
          <p style="margin: 0; font-size: 16px; line-height: 1.7; color: #757575">您已完成「供應商保密協議（NDA）」的簽署，感謝您的配合。</p>
        </div>
      </div>

      <dl style="margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 24px">
        <dt style="font-size: 14px; font-weight: 500; line-height: 1.7; color: #757575">簽署人</dt>
        <dd style="margin: 0; font-size: 14px; line-height: 1.7; color: #212121; overflow-wrap: anywhere">王大明（daming.wang@example.com）</dd>
        <dt style="font-size: 14px; font-weight: 500; line-height: 1.7; color: #757575">簽署時間</dt>
        <dd style="margin: 0; font-size: 14px; line-height: 1.7; color: #212121">2026/10/20 14:32</dd>
      </dl>

      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px">
<button type="button" style="height: 42px; padding: 0 22px 0 16px; border: 0; border-radius: 4px; background: #1976D2; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; box-shadow: 0 3px 1px -2px rgba(0,0,0,0.2), 0 2px 2px 0 rgba(0,0,0,0.14), 0 1px 5px 0 rgba(0,0,0,0.12); cursor: pointer">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FFFFFF" d="M16.59 9H15V4c0-.55-.45-1-1-1h-4c-.55 0-1 .45-1 1v5H7.41c-.89 0-1.34 1.08-.71 1.71l4.59 4.59c.39.39 1.02.39 1.41 0l4.59-4.59c.63-.63.19-1.71-.7-1.71M5 19c0 .55.45 1 1 1h12c.55 0 1-.45 1-1s-.45-1-1-1H6c-.55 0-1 .45-1 1"></path></svg>

      </div>

      <div role="note" style="display: flex; gap: 12px; padding: 6px 16px; border-radius: 4px; background: #DFEEF7">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; padding: 7px 0"><path fill="#288BC8" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2m0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1m1-8h-2V7h2z"></path></svg>
        <span style="padding: 8px 0; font-size: 14px; line-height: 1.7; color: #103850">之後可隨時再次開啟邀請信中的連結下載，請妥善保管邀請信，不要轉寄給他人。</span>
      </div>
    </section>
  </main>
</div>
