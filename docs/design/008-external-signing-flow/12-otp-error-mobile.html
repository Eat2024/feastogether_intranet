<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>驗證碼錯誤（手機）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#288BC8}a:hover{color:#2276AA}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F5F6; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #212121; overflow: hidden">
  <header style="height: 56px; flex: none; display: flex; align-items: center; padding: 0 16px; background: #202229">
    <span style="font-size: 20px; font-weight: 700; line-height: 1.25; color: #FFFFFF">電子簽署</span>
  </header>

  <main style="flex: 1; display: flex; justify-content: center; padding: 120px 16px 16px">
    <section style="width: 100%; box-sizing: border-box; padding: 24px; background: #FFFFFF; border-radius: 16px; box-shadow: 0 0 10px rgba(0,0,0,0.125); display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; align-self: flex-start">
      <svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><path fill="#1976D2" d="M18.05 21.29c-.39.39-1.02.39-1.41 0l-2.12-2.12a.996.996 0 0 1 0-1.41c.39-.39 1.02-.39 1.41 0l1.41 1.41 3.54-3.54c.39-.39 1.02-.39 1.41 0s.39 1.02 0 1.41zM12.08 20H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2h16c1.1 0 2 .9 2 2v6.68c-.91-.43-1.92-.68-3-.68-3.87 0-7 3.13-7 7 0 .34.03.67.08 1m-.61-7.33c.32.2.74.2 1.06 0l7.07-4.42c.25-.16.4-.43.4-.72 0-.67-.73-1.07-1.3-.72L12 11 5.3 6.81c-.57-.35-1.3.05-1.3.72 0 .29.15.56.4.72z"></path></svg>
      <h1 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.25; color: #424242">輸入驗證碼</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.7; color: #757575">驗證碼已寄到 d***@example.com，10 分鐘內有效。</p>
      <div style="width: 100%; display: flex; flex-direction: column; gap: 8px; margin-top: 16px">
        <div style="display: flex; flex-direction: column; gap: 4px; text-align: left">
          <div style="position: relative; height: 56px; box-sizing: border-box; border: 2px solid #FF5254; border-radius: 4px; display: flex; align-items: center; padding: 0 13px">
            <label for="otp-code-error" style="position: absolute; top: -10px; left: 10px; padding: 0 4px; background: #FFFFFF; font-size: 12px; line-height: 1.7; color: #D94647">6 位數驗證碼</label>
            <input id="otp-code-error" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="482913" aria-invalid="true" aria-describedby="otp-error-text" style="width: 100%; border: 0; outline: none; background: transparent; font: inherit; font-size: 20px; letter-spacing: 8px; text-align: center; color: #212121">
          </div>
          <span id="otp-error-text" role="alert" style="padding: 0 14px; font-size: 12px; line-height: 1.7; color: #D94647">驗證碼錯誤，還可以再試 3 次。</span>
        </div>
        <button type="button" style="width: 100%; height: 42px; padding: 0 22px; border: 0; border-radius: 4px; background: #1976D2; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 3px 1px -2px rgba(0,0,0,0.2), 0 2px 2px 0 rgba(0,0,0,0.14), 0 1px 5px 0 rgba(0,0,0,0.12); cursor: pointer">驗證並開啟文件</button>
        <button type="button" style="width: 100%; height: 42px; padding: 0 22px; border: 0; border-radius: 4px; background: transparent; color: #1976D2; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">重新寄送驗證碼</button>
      </div>
      <p style="margin: 8px 0 0; font-size: 12px; line-height: 1.7; color: #757575">錯誤 5 次或超過 10 分鐘，驗證碼即失效，請重新寄送。</p>
    </section>
  </main>
</div>
</body>
</html>
