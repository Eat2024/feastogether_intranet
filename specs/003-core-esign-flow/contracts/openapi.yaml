openapi: 3.1.0
info:
  title: 核心電子簽端到端流程 API
  version: 1.0.0
  description: |
    Spec 03 的最小 REST contract。內部 endpoint 使用 Spec 2 員工 session；
    external endpoint 僅使用單一簽署人／單一文件的受限 cookie。
    所有 POST/PUT/PATCH/DELETE 都必須通過 Server-side OriginGuard；缺少或不符的 browser write 回 403。
servers:
  - url: /api
security:
  - employeeSession: []

paths:
  /esign/signer-candidates:
    get:
      operationId: listSignerCandidates
      summary: 查詢可指定的 active 內部員工
      description: |
        先查本地 users。q 為完整八碼員編且本地查無時，改向饗賓人 API 查詢試用／正式員工，
        比照登入流程建立本地帳號後回傳；查無或資格不符回傳空清單，已停用帳號不重新啟用。
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: 最小員工選擇資料
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignerCandidateListSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { description: 饗賓人 API 查詢失敗 }

  /esign/documents:
    get:
      operationId: listDocuments
      summary: 列出目前員工建立或被指定的文件
      parameters:
        - name: role
          in: query
          schema: { type: string, enum: [created, assigned] }
        - name: status
          in: query
          schema: { type: string, enum: [draft, active, expired, finalizing, completed, stopped] }
      responses:
        "200":
          description: 已裁切的文件清單
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentListSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createDraftDocument
      summary: 上傳 PDF 並建立草稿，可一併帶入草稿欄位
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [title, file]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                file:
                  type: string
                  contentMediaType: application/pdf
                  contentEncoding: binary
                fields:
                  type: string
                  contentMediaType: application/json
                  contentSchema:
                    type: array
                    maxItems: 200
                    items: { $ref: "#/components/schemas/FieldPlacement" }
                  description: 選填，JSON 字串；與 PDF、草稿同一交易寫入，任一不合法整筆不建立。不要求先選擇簽署人，欄位為全體共用
      responses:
        "201":
          description: 已完成 PDF 儲存及草稿建立，僅回傳文件 ID；詳情另由 GET 取得
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentWriteSuccess" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/FileTooLarge" }

  /esign/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getDocument
      summary: creator 取得文件管理詳情；assigned signer 改用 signing-task resource
      responses:
        "200":
          description: creator 可見的文件、簽署人 snapshot 與狀態；不含簽名圖
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentDetailSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateDraftDocument
      summary: 替換草稿標題、PDF 或欄位，僅 creator + draft
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                file:
                  type: string
                  contentMediaType: application/pdf
                  contentEncoding: binary
                fields:
                  type: string
                  contentMediaType: application/json
                  contentSchema:
                    type: array
                    maxItems: 200
                    items: { $ref: "#/components/schemas/FieldPlacement" }
                  description: 選填，JSON 字串；有帶時整批取代草稿欄位（全體共用）。換 PDF 而未帶時清空欄位
              minProperties: 1
      responses:
        "200":
          description: 草稿更新完成，僅回傳文件 ID；詳情另由 GET 取得
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentWriteSuccess" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }
        "413": { $ref: "#/components/responses/FileTooLarge" }
    delete:
      operationId: deleteDraftDocument
      summary: soft-delete creator 的草稿
      responses:
        "204": { description: 已刪除草稿 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }

  /esign/documents/{documentId}/draftSave:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    put:
      operationId: replaceDraftSigners
      summary: 取代草稿簽署人，僅 creator + draft；既有共用欄位保留，不因名單改變而複製或變更
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [signers]
              properties:
                signers:
                  description: 完整簽署人名單，不設人數上限，不得截斷或要求拆成多份文件
                  type: array
                  minItems: 1
                  items:
                    oneOf:
                      - $ref: "#/components/schemas/InternalSignerInput"
                      - $ref: "#/components/schemas/ExternalSignerInput"
      responses:
        "200":
          description: 更新後的簽署人
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignerListSuccess" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }

  /esign/documents/{documentId}/fields:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    put:
      operationId: replaceDraftFields
      summary: 取代草稿欄位，僅 creator + draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fields]
              properties:
                fields:
                  type: array
                  maxItems: 200
                  items: { $ref: "#/components/schemas/FieldInput" }
      responses:
        "200":
          description: 更新後的欄位
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldListSuccess" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }

  /esign/documents/{documentId}/initiations:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    post:
      operationId: initiateDocument
      summary: 同一交易儲存簽署人與共用欄位、驗證並發起文件
      description: fields 不含 signerIndex 或 signerPublicId；最多 200 個共用欄位，不設簽署人數上限且至少一人；至少一個 signature 欄位。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [signers, fields, signStartAt, signEndAt, watermark, allowReject]
              properties:
                signers:
                  description: 完整簽署人名單，不設人數上限，不得截斷或要求拆成多份文件
                  type: array
                  minItems: 1
                  items:
                    oneOf:
                      - $ref: "#/components/schemas/InternalSignerInput"
                      - $ref: "#/components/schemas/ExternalSignerInput"
                fields:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: "#/components/schemas/InitiationFieldInput" }
                signStartAt: { type: string, format: date-time }
                signEndAt: { type: string, format: date-time }
                watermark:
                  type: boolean
                  description: 浮水印選項的固定快照，寫入 esign_documents.watermark_enabled；本次個人副本未實作浮水印繪製，正式前端固定傳 false
                allowReject:
                  type: boolean
                  description: 是否允許簽署人拒絕簽署；寫入 esign_documents.allow_reject
      responses:
        "201":
          description: 文件已固定並進入 active；外部邀請交由 worker 寄送
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentDetailSuccess" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }

  /esign/documents/{documentId}/reopenings:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    post:
      operationId: reopenDocument
      summary: 建立人立即重新開放已到期文件補簽
      description: 需要員工 session 與可信 Origin。比對目前期限防止重送；保留固定證據，只為未簽署外部簽署人輪替邀請，不新增寄信工作。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedSignEndAt, signEndAt, reason]
              properties:
                expectedSignEndAt: { type: string, format: date-time, description: 讀取的目前有效期限；必須帶明確時區且最多毫秒精度 }
                signEndAt: { type: string, format: date-time, description: 嚴格晚於目前期限及鎖內現在時間；必須帶明確時區且最多毫秒精度 }
                reason: { type: string, minLength: 1, maxLength: 500, description: trim 後 1–500 個 Unicode code points }
      responses:
        "201":
          description: 補簽交易成功；不含邀請憑證
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessBase"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [documentId, status, originalSignEndAt, signEndAt, isReopened, reopenedAt, pendingCount]
                        properties:
                          documentId: { type: string }
                          status: { type: string, const: active }
                          originalSignEndAt: { type: string, format: date-time }
                          signEndAt: { type: string, format: date-time }
                          isReopened: { type: boolean, const: true }
                          reopenedAt: { type: string, format: date-time }
                          pendingCount: { type: integer, minimum: 1 }
        "400": { description: ESIGN_REOPEN_INPUT_INVALID，輸入或新期限不合法 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Origin 不被允許 }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: ESIGN_REOPEN_STALE（期限已變更）或 ESIGN_DOCUMENT_NOT_REOPENABLE（不可補簽）或 ESIGN_INTEGRITY_FAILED（固定證據損毀），前端重新讀取而不自動重送 }

  /esign/documents/{documentId}/reopening-invitations:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getReopeningInvitations
      summary: 建立人主動取得有效補簽外部邀請
      description: 唯讀且可重讀；只回目前 active 補簽輪的 pending email signer。尚未補簽或已結束回空陣列。不得將此回應放入一般詳情、日誌或 analytics。
      responses:
        "200":
          description: 目前有效邀請，沒有符合者為空陣列
          headers:
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
            Referrer-Policy: { schema: { type: string, const: "no-referrer" } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessBase"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required: [signerPublicId, invitationUrl, expiresAt]
                          properties:
                            signerPublicId: { type: string, format: uuid }
                            invitationUrl: { type: string, format: uri }
                            expiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: 有效邀請密文缺漏、損毀或 digest 不符；不重建憑證 }

  /esign/documents/{documentId}/stoppages:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    post:
      operationId: stopDocument
      summary: creator 停止未完成的 active、expired 或 finalizing 文件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201":
          description: 已停止且保留原文件與證據
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentDetailSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }

  /esign/documents/{documentId}/source-file:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: downloadDocumentSourceFile
      summary: creator、active 期間的 assigned signer，或已簽 signer 下載原 PDF；stopped 的 pending signer 不可讀取
      responses:
        "200": { $ref: "#/components/responses/PdfFile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /esign/documents/{documentId}/history:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      operationId: getDocumentHistory
      summary: creator 或該文件 signer 取得已裁切的不可變歷程
      responses:
        "200":
          description: creator 可見文件層級事件；signer 只可見文件狀態與本人事件，不含其他人身分或簽名
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistorySuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /esign/documents/{documentId}/signers/{signerPublicId}/completed-file:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/SignerPublicId"
    get:
      operationId: downloadSignerCompletedFile
      summary: 建立人依簽署人下載 ready 個人副本
      description: 必須驗證 signer 屬於指定文件且目前員工為建立人；active、expired、finalizing、completed、stopped 均可取得 ready 副本。未授權或目標不存在為 404；尚未 ready 為 409。
      responses:
        "200": { $ref: "#/components/responses/PdfFile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }

  /esign/signing-tasks/{signerPublicId}/completed-file:
    parameters:
      - $ref: "#/components/parameters/SignerPublicId"
    get:
      operationId: downloadMyCompletedFile
      summary: 已簽署內部員工下載本人 ready 個人副本
      description: 不等待全員結案；必須屬於目前員工。其他人的 publicId 一律 404，不回簽署或產製狀態；本人未 ready 為 409。
      responses:
        "200": { $ref: "#/components/responses/PdfFile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }

  /esign/signing-tasks:
    get:
      operationId: listMySigningTasks
      summary: 列出目前員工的待簽／已簽任務
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, signed] }
      responses:
        "200":
          description: 僅本人任務
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningTaskListSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /esign/signing-tasks/{signerPublicId}:
    parameters:
      - $ref: "#/components/parameters/SignerPublicId"
    post:
      operationId: openMySigningTask
      summary: 開啟內部員工本人簽署任務，同 transaction 追加 document.opened audit
      responses:
        "200":
          description: 僅本人 snapshot/欄位、文件 metadata 與整體計數
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningTaskSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /esign/signing-tasks/{signerPublicId}/source-file:
    parameters:
      - $ref: "#/components/parameters/SignerPublicId"
    get:
      operationId: downloadMySigningTaskSourceFile
      summary: 下載本人被指定的固定 PDF
      responses:
        "200": { $ref: "#/components/responses/PdfFile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /esign/signing-tasks/{signerPublicId}/signatures:
    parameters:
      - $ref: "#/components/parameters/SignerPublicId"
    post:
      operationId: signMySigningTask
      summary: 內部員工提交本人所有必要手寫簽名
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignatureSubmission" }
      responses:
        "201":
          description: 成功簽署證據；完成 PDF 可能仍在 worker 產製
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignatureResultSuccess" }
        "200":
          description: 相同 request 重試時回傳已存在結果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignatureResultSuccess" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }

  /external-signature-invitations/{token}:
    get:
      operationId: getExternalInvitationBridge
      summary: 取得將 invitation token POST 到同源 session resource 的唯讀 bridge
      description: "由 Spec 008 取代：bridge 表單改送 POST /external-signature-otps（寄出驗證碼並回驗證碼輸入頁），不再直接 POST /external-signature-session。詳見 specs/008-external-signing-flow/contracts/http-api.md。"
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]+$" }
      responses:
        "200":
          description: 不驗證／消耗 token，只回 no-store HTML form bridge
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
            Content-Security-Policy: { schema: { type: string } }
          content:
            text/html: { schema: { type: string } }
        "400": { description: token 格式無效，不回傳員工／文件資訊 }

  /external-signature-session:
    post:
      operationId: createExternalSignatureSession
      summary: 驗證 invitation 後設定單文件受限 HttpOnly cookie
      description: "由 Spec 008 取代：須先由 POST /external-signature-otps 寄出驗證碼，本端點改收 token＋code（6 位數驗證碼），驗證碼正確才設 session cookie（不設 Expires，待簽者與已簽者相同）；驗證碼錯誤或失效回 401 驗證碼錯誤頁，code 格式錯誤回 400；憑證有效、待簽但早於 signStartAt 時回 409 尚未開始頁。下方 401 的「已簽署」不再適用。詳見 specs/008-external-signing-flow/contracts/http-api.md。"
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 43, maxLength: 43, pattern: "^[A-Za-z0-9_-]+$" }
      responses:
        "303":
          description: 導向不含 token 的 external signing page；token 本身不被消耗
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
            Set-Cookie: { schema: { type: string } }
            Location: { schema: { type: string, pattern: "^/external-signatures/[0-9a-f-]{36}$" } }
        "400": { description: token 格式無效 }
        "401": { description: token 無效、過期、已簽署或文件已終止 }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: clearExternalSignatureSession
      summary: 清除瀏覽器的 external access cookie
      security: []
      responses:
        "204":
          description: 無條件清除 cookie，重複操作仍成功
          headers:
            Set-Cookie: { schema: { type: string } }

  /external-signing-task:
    post:
      operationId: openExternalSigningTask
      summary: 開啟 external cookie 綁定的唯一簽署任務，同 transaction 追加 document.opened audit
      description: "由 Spec 008 取代：已簽署者也可開啟（不比對期限與文件狀態），依 signer.status 顯示完成畫面。Spec 008 另新增唯讀 GET /external-signing-task（不記稽核）與 GET /external-signing-task/completed-file（下載本人副本）。詳見 specs/008-external-signing-flow/contracts/http-api.md。"
      security:
        - externalAccess: []
      responses:
        "200":
          description: 僅該 external signer 與其欄位
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningTaskSuccess" }
        "401": { $ref: "#/components/responses/ExternalUnauthorized" }

  /external-signing-task/source-file:
    get:
      operationId: downloadExternalSigningTaskSourceFile
      summary: 下載 external cookie 綁定的固定 PDF
      description: "由 Spec 008 取代：授權改為外部存取檢查，已簽署者也可讀取。詳見 specs/008-external-signing-flow/contracts/http-api.md。"
      security:
        - externalAccess: []
      responses:
        "200": { $ref: "#/components/responses/PdfFile" }
        "401": { $ref: "#/components/responses/ExternalUnauthorized" }

  /external-signing-task/signatures:
    post:
      operationId: signExternalSigningTask
      summary: 外部簽署人提交所有必要手寫簽名
      description: "由 Spec 008 取代：成功（201）與同一 requestId 重送（200，回既有結果）都不清除 access cookie，改以同一 token 設為 session cookie；已簽者以新的 requestId 簽署為 401。下方 200／201 的說明不再適用。詳見 specs/008-external-signing-flow/contracts/http-api.md。"
      security:
        - externalAccess: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignatureSubmission" }
      responses:
        "200":
          description: 僅在仍可驗證當次請求身分時回傳既有結果；邀請失效後重送為 401，不核發 receipt
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignatureResultSuccess" }
        "201":
          description: 成功簽署並清除 invitation access cookie，不核發 receipt；當次回應可含 Spec 04 verificationUrl
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignatureResultSuccess" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/ExternalUnauthorized" }
        "409": { $ref: "#/components/responses/StateConflict" }

components:
  securitySchemes:
    employeeSession:
      type: apiKey
      in: cookie
      name: FT_ESIGN_SESSION
      description: Spec 2 員工 session
    externalAccess:
      type: apiKey
      in: cookie
      name: FT_ESIGN_EXTERNAL_ACCESS
      description: 單一 external signer/document 的 invitation token；Server 每次重驗狀態與期限
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, pattern: "^[1-9][0-9]*$" }
    SignerPublicId:
      name: signerPublicId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    InvalidRequest:
      description: 輸入、PDF、簽署人或欄位無效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: 無有效員工 session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ExternalUnauthorized:
      description: 外部憑證無效、過期，或任務已終止；不區分具體原因
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: resource 不存在或 principal 無權存取
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    StateConflict:
      description: 文件／簽署人狀態、期限、hash 或冪等結果不允許此操作
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    FileTooLarge:
      description: PDF 超過 20 MiB
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unavailable:
      description: MySQL 或必要私有儲存不可用，fail closed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    PdfFile:
      description: 通過 resource-level authorization 後 stream PDF
      headers:
        Cache-Control: { schema: { type: string, const: "private, no-store" } }
        X-Content-Type-Options: { schema: { type: string, const: nosniff } }
      content:
        application/pdf:
          schema: { type: string, contentMediaType: application/pdf, contentEncoding: binary }

  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string, description: 繁體中文且不含敏感資料 }
            details:
              type: array
              items:
                type: object
                required: [field, reason]
                properties:
                  field: { type: string }
                  reason: { type: string }

    InternalSignerInput:
      type: object
      additionalProperties: false
      required: [type, userId]
      properties:
        type: { type: string, const: user }
        userId: { type: string, pattern: "^[1-9][0-9]*$" }
    ExternalSignerInput:
      type: object
      additionalProperties: false
      required: [type, name, email]
      properties:
        type: { type: string, const: email }
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
    FieldInput:
      type: object
      additionalProperties: false
      required: [type, page, xPercent, yPercent, widthPercent, heightPercent, sortOrder]
      properties:
        type: { type: string, enum: [signature, date] }
        page: { type: integer, minimum: 1, maximum: 100 }
        xPercent: { type: number, minimum: 0, exclusiveMaximum: 100 }
        yPercent: { type: number, minimum: 0, exclusiveMaximum: 100 }
        widthPercent: { type: number, exclusiveMinimum: 0, maximum: 100 }
        heightPercent: { type: number, exclusiveMinimum: 0, maximum: 100 }
        sortOrder: { type: integer, minimum: 0 }
    FieldPlacement:
      type: object
      additionalProperties: false
      description: 草稿欄位位置（上傳 PDF 時一併帶入），不含簽署人
      required: [type, page, xPercent, yPercent, widthPercent, heightPercent, sortOrder]
      properties:
        type: { type: string, enum: [signature, date] }
        page: { type: integer, minimum: 1, maximum: 100 }
        xPercent: { type: number, minimum: 0, exclusiveMaximum: 100 }
        yPercent: { type: number, minimum: 0, exclusiveMaximum: 100 }
        widthPercent: { type: number, exclusiveMinimum: 0, maximum: 100 }
        heightPercent: { type: number, exclusiveMinimum: 0, maximum: 100 }
        sortOrder: { type: integer, minimum: 0 }
    InitiationFieldInput:
      type: object
      additionalProperties: false
      required: [type, page, xPercent, yPercent, widthPercent, heightPercent, sortOrder]
      properties:
        type: { type: string, enum: [signature, date] }
        page: { type: integer, minimum: 1, maximum: 100 }
        xPercent: { type: number, minimum: 0, exclusiveMaximum: 100 }
        yPercent: { type: number, minimum: 0, exclusiveMaximum: 100 }
        widthPercent: { type: number, exclusiveMinimum: 0, maximum: 100 }
        heightPercent: { type: number, exclusiveMinimum: 0, maximum: 100 }
        sortOrder: { type: integer, minimum: 0 }
    SignatureSubmission:
      type: object
      additionalProperties: false
      required: [requestId, consentVersion, accepted, signatures]
      properties:
        requestId: { type: string, format: uuid }
        consentVersion: { type: string, minLength: 1, maxLength: 50 }
        accepted: { type: boolean, const: true }
        signatures:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [fieldId, pngDataUrl]
            properties:
              fieldId: { type: string, pattern: "^[1-9][0-9]*$" }
              pngDataUrl:
                type: string
                maxLength: 400000
                pattern: "^data:image/png;base64,"

    DocumentSummary:
      type: object
      additionalProperties: false
      required: [id, docNumber, title, status, createdAt, pendingCount, signedCount, signEndAt, originalSignEndAt, isReopened]
      properties:
        id: { type: string }
        docNumber: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [draft, active, expired, finalizing, completed, stopped] }
        createdAt: { type: string, format: date-time }
        initiatedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        stoppedAt: { type: [string, "null"], format: date-time }
        signEndAt: { type: [string, "null"], format: date-time, description: 目前有效截止時間 }
        originalSignEndAt: { type: [string, "null"], format: date-time, description: 固定簽署快照中的原始截止時間 }
        isReopened: { type: boolean, description: 有效期限是否已經由補簽變更 }
        pendingCount: { type: integer, minimum: 0 }
        signedCount: { type: integer, minimum: 0 }
    DocumentListItem:
      description: 文件列表項目；摘要再加上簽署期間與建立人（僅員工 session 的列表回傳）
      allOf:
        - $ref: "#/components/schemas/DocumentSummary"
        - type: object
          required: [signStartAt, signEndAt, createdBy]
          properties:
            signStartAt: { type: [string, "null"], format: date-time }
            signEndAt: { type: [string, "null"], format: date-time }
            createdBy:
              type: [object, "null"]
              additionalProperties: false
              required: [name, employeeNo]
              properties:
                name: { type: string }
                employeeNo: { type: string }
    DocumentDetail:
      allOf:
        - $ref: "#/components/schemas/DocumentSummary"
        - type: object
          properties:
            createdBy:
              description: 建立人；帳號不存在時為 null
              type: [object, "null"]
              additionalProperties: false
              required: [name, employeeNo]
              properties:
                name: { type: string }
                employeeNo: { type: string }
            sourceFile:
              type: object
              required: [fileName, size, pageCount, sha256]
              properties:
                fileName: { type: string }
                size: { type: integer }
                pageCount: { type: integer }
                sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
            signStartAt: { type: [string, "null"], format: date-time }
            signEndAt: { type: [string, "null"], format: date-time }
            stopReason: { type: [string, "null"] }
            signers:
              type: array
              items: { $ref: "#/components/schemas/SignerView" }
            fields:
              type: array
              items: { $ref: "#/components/schemas/FieldView" }
    SignerView:
      type: object
      additionalProperties: false
      required: [publicId, type, name, status, completion]
      properties:
        publicId: { type: string, format: uuid }
        type: { type: string, enum: [user, email] }
        name: { type: string }
        employeeNo: { type: [string, "null"] }
        department: { type: [string, "null"] }
        title: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        status: { type: string, enum: [pending, signed] }
        signedAt: { type: [string, "null"], format: date-time }
        completion: { $ref: "#/components/schemas/PersonalCompletion" }
        invitationDelivery: { type: [string, "null"], enum: [pending, delivered, failed, null], description: 補簽輪為 null，不沿用初次邀請投遞結果 }
    FieldView:
      type: object
      additionalProperties: false
      required: [id, type, page, xPercent, yPercent, widthPercent, heightPercent, sortOrder]
      properties:
        id: { type: string }
        type: { type: string, enum: [signature, date] }
        page: { type: integer, minimum: 1, maximum: 100 }
        xPercent: { type: number, minimum: 0, exclusiveMaximum: 100 }
        yPercent: { type: number, minimum: 0, exclusiveMaximum: 100 }
        widthPercent: { type: number, exclusiveMinimum: 0, maximum: 100 }
        heightPercent: { type: number, exclusiveMinimum: 0, maximum: 100 }
        sortOrder: { type: integer, minimum: 0 }
    PersonalCompletion:
      type: object
      additionalProperties: false
      required: [status, readyAt]
      properties:
        status: { type: [string, "null"], enum: [pending, processing, ready, failed, null] }
        readyAt: { type: [string, "null"], format: date-time }
      description: 未簽署時 status 為 null；ready 後可依資源權限下載。不得回傳 object key 或其他人資料。
    SigningTask:
      type: object
      additionalProperties: false
      required: [signerPublicId, document, signer, fields, consent, pendingCount, signedCount]
      properties:
        signerPublicId: { type: string, format: uuid }
        document:
          description: 內部簽署人的任務另含簽署期間與發起人（DocumentListItem）；外部簽署人只有摘要
          anyOf:
            - $ref: "#/components/schemas/DocumentListItem"
            - $ref: "#/components/schemas/DocumentSummary"
        signer: { $ref: "#/components/schemas/SignerView" }
        fields:
          type: array
          items: { $ref: "#/components/schemas/FieldView" }
        consent:
          type: object
          additionalProperties: false
          required: [version, text, sha256]
          properties:
            version: { type: string }
            text: { type: string }
            sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        pendingCount: { type: integer }
        signedCount: { type: integer }
    SignatureResult:
      type: object
      additionalProperties: false
      required: [signerPublicId, signedAt, documentStatus, completion]
      properties:
        signerPublicId: { type: string, format: uuid }
        signedAt: { type: string, format: date-time }
        verificationUrl: { type: [string, "null"], format: uri, description: Spec 04 公開驗證入口，不授予檔案下載 }
        completion: { $ref: "#/components/schemas/PersonalCompletion" }
        documentStatus: { type: string, enum: [active, expired, finalizing, completed, stopped] }

    SuccessBase:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    DocumentListSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessBase"
        - type: object
          required: [data]
          properties: { data: { type: array, items: { $ref: "#/components/schemas/DocumentListItem" } } }
    DocumentDetailSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessBase"
        - type: object
          required: [data]
          properties: { data: { $ref: "#/components/schemas/DocumentDetail" } }
    DocumentWriteSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessBase"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: false
              required: [id]
              properties:
                id: { type: string }
    SignerListSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessBase"
        - type: object
          required: [data]
          properties: { data: { type: array, items: { $ref: "#/components/schemas/SignerView" } } }
    FieldListSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessBase"
        - type: object
          required: [data]
          properties: { data: { type: array, items: { $ref: "#/components/schemas/FieldView" } } }
    SigningTaskListSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessBase"
        - type: object
          required: [data]
          properties: { data: { type: array, items: { $ref: "#/components/schemas/SigningTask" } } }
    SigningTaskSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessBase"
        - type: object
          required: [data]
          properties: { data: { $ref: "#/components/schemas/SigningTask" } }
    SignatureResultSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessBase"
        - type: object
          required: [data]
          properties: { data: { $ref: "#/components/schemas/SignatureResult" } }
    SignerCandidateListSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessBase"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, employeeNo, name]
                properties:
                  id: { type: string }
                  employeeNo: { type: string }
                  name: { type: string }
                  department: { type: [string, "null"] }
                  title: { type: [string, "null"] }
    HistorySuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessBase"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [type, occurredAt]
                properties:
                  type: { type: string }
                  occurredAt: { type: string, format: date-time }
                  actorUserId: { type: string, description: 補簽事件僅建立人可見 }
                  previousSignEndAt: { type: string, format: date-time, description: 補簽事件僅建立人可見 }
                  signEndAt: { type: string, format: date-time, description: 補簽事件的新有效期限 }
                  actor: { type: [string, "null"], description: 裁切後的「建立人／本人／系統」類別；簽署人所見補簽事件省略此欄位 }
                  reason: { type: [string, "null"], description: 補簽原因只對 creator 揭露；簽署人補簽事件只含 type／occurredAt／signEndAt }
